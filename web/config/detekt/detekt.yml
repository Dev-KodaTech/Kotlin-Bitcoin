# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true in web/build.gradle.kts).
# Any rule not listed here keeps its default setting. Applied to every module of the web build.
# :core, :state and :data add detekt-precision.yml; :ui adds detekt-ui.yml (research.md W-06).

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 4
  ComplexInterface:
    active: true
    threshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSimpleWhenEntries: true
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignorePrivate: true
    ignoreOverridden: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    # Only ApiCall (data/http) and the browser adapters (data/browser) may catch; they convert to Outcome (Principle III).
    excludes: ['**/data/http/**', '**/data/browser/**', '**/*Test/**', '**/e2e/**']

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  MagicNumber:
    active: true
    excludes: ['**/*Test/**', '**/test/**', '**/*.kts']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  WildcardImport:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Resolve or turn into a task in tasks.md.'
        value: 'FIXME:'
      - reason: 'Resolve or turn into a task in tasks.md.'
        value: 'STOPSHIP:'
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Locale-dependent formatting; use the pt-BR formatters of :core/format.'
        value: 'kotlin.text.format'
      - reason: 'No console output: it could leak the session token (FR-008).'
        value: 'kotlin.io.println'
