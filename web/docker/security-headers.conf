# Security headers of every response of the client (research.md W-15). Included in each location, because a
# location with its own add_header does not inherit the ones of the server.
# style-src: the hash is the <style> that Compose 1.12.2 injects into its shadow root (W-15 result); it changes when
# that style changes, and the E2E (0 CSP violations) detects it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'sha256-2DtT88WYuzB8DiHdoLqEYkONEwxf9gqsOdTY44QuLA4='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
