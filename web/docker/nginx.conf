# nginx of the web client (research.md W-15): serves the Kotlin/Wasm bundle and proxies /api/ to the API's nginx,
# so the browser sees one origin (no CORS). Unprivileged image: port 8080, pid and temp files in /tmp.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # The default access log has no headers, so the bearer token never reaches it (FR-008).
    access_log /dev/stdout;

    # Pre-compressed files (.br, .gz) from the image build; dynamic gzip only as a fallback.
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml font/ttf;

    # Content-hashed names never change (the Kotlin/Wasm distribution names its .wasm files by hash, e.g.
    # 5549990ba6c99f9e2d05.wasm); everything else (index.html, app.js, compat.js, composeResources) revalidates.
    map $uri $cache_control {
        "~^/[0-9a-f]{16,}\.(wasm|js|mjs)$" "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://nginx:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Authorization and X-Correlation-Id are forwarded as received (nginx passes request headers through).
            proxy_read_timeout 30s;
        }

        location ~* \.wasm$ {
            # Declared explicitly, although recent mime.types already maps it.
            types { application/wasm wasm; }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control $cache_control always;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control $cache_control always;
            # Routes live in the URL fragment; this fallback only covers old or typed paths.
            try_files $uri $uri/ /index.html;
        }
    }
}
