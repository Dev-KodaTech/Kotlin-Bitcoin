name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Unit, integration (Testcontainers on the runner's Docker), contract, ktlint and detekt.
      - name: Check
        run: ./gradlew check --no-daemon

      - name: Docker build
        run: docker build -t kotlinbitcoins:ci .

  # Web client (specs/002-frontend-web): its own Gradle build in web/. The :ui tests run in headless Chrome.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Export CHROME_BIN
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Check
        run: ./gradlew check --no-daemon

      - name: Distribution
        run: ./gradlew :app:wasmJsBrowserDistribution --no-daemon

      - name: Docker build
        run: docker build -t kotlinbitcoins-web:ci .

  # End-to-end tests of the web client (T223): the whole stack with the quote stub, Playwright for Java + axe-core in
  # Chromium, Firefox and WebKit against http://localhost:8081 (research.md W-17).
  web-e2e:
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Test values only: the stack lives for this job and is removed at the end.
      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^SPRING_PROFILES_ACTIVE=.*|SPRING_PROFILES_ACTIVE=dev|" \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48)|" \
            -e "s|^QUOTE_PROVIDER_URL=.*|QUOTE_PROVIDER_URL=http://quote-stub:8080/api/BTC/ticker/|" \
            -e "s|^BREVO_API_KEY=.*|BREVO_API_KEY=unused-in-ci|" \
            -e "s|^DB_USER=.*|DB_USER=kotlinbitcoins|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-$(openssl rand -hex 12)|" \
            -e "s|^RABBITMQ_USER=.*|RABBITMQ_USER=kotlinbitcoins|" \
            -e "s|^RABBITMQ_PASSWORD=.*|RABBITMQ_PASSWORD=ci-$(openssl rand -hex 12)|" \
            -e "s|^MAIL_FROM=.*|MAIL_FROM=no-reply@example.com|" \
            .env

      - name: Start the stack (API, quote stub and web client)
        run: docker compose --profile stub up -d --build --wait

      - name: Install the Playwright browsers
        working-directory: web
        run: |
          ./gradlew :e2e:testClasses --no-daemon
          CLASSPATH="$(./gradlew -q :e2e:printTestClasspath --no-daemon)"
          java -cp "$CLASSPATH" com.microsoft.playwright.CLI install --with-deps

      - name: E2E tests
        working-directory: web
        run: ./gradlew :e2e:e2eTest --no-daemon

      - name: Publish the E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports
          path: web/e2e/build/reports/
          if-no-files-found: ignore

      - name: Logs of the stack
        if: failure()
        run: docker compose --profile stub logs --no-color --tail=300

      - name: Stop the stack
        if: always()
        run: docker compose --profile stub down -v
