name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Unit, integration (Testcontainers on the runner's Docker), contract, ktlint and detekt.
      - name: Check
        run: ./gradlew check --no-daemon

      - name: Docker build
        run: docker build -t kotlinbitcoins:ci .
